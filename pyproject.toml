[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nea"
version = "0.1.0"
description = "Frozen NEA paper experiment source"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy==2.5.1",
    "torch==2.13.0+cu130",
    "sentence-transformers==5.6.0",
    "transformers==5.6.2",
    "pymilvus==3.0.1",
    "neo4j==6.3.0",
    "python-dotenv==1.2.3",
]

[tool.setuptools.packages.find]
include = ["nea*"]
